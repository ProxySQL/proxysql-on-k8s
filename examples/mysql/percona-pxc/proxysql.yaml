apiVersion: proxysql.com/v1alpha1
kind: ProxySQLCluster
metadata:
  name: proxysql
  namespace: percona-pxc-demo
spec:
  replicas: 3
  protocols:
    mysql:
      enabled: true
---
apiVersion: proxysql.com/v1alpha1
kind: ProxySQLConfig
metadata:
  name: pxcfg
  namespace: percona-pxc-demo
spec:
  clusterRef:
    name: proxysql
  # Declare all three Galera nodes in the WRITER hostgroup only. ProxySQL's
  # Galera monitor reads each node's wsrep state and distributes them across
  # the four hostgroups below; the operator follows those moves instead of
  # re-asserting static placement. The PXC operator publishes the headless
  # service `<name>-pxc-unready` for bootstrap; once the cluster is healthy,
  # the regular `<name>-pxc` Service exposes only the three voting nodes. We
  # point at the stable per-pod DNS so a pod restart doesn't shift routing.
  mysqlServers:
    - hostgroup: 0
      hostname: cluster1-pxc-0.cluster1-pxc.percona-pxc-demo.svc.cluster.local
      port: 3306
      weight: 1000
    - hostgroup: 0
      hostname: cluster1-pxc-1.cluster1-pxc.percona-pxc-demo.svc.cluster.local
      port: 3306
      weight: 1000
    - hostgroup: 0
      hostname: cluster1-pxc-2.cluster1-pxc.percona-pxc-demo.svc.cluster.local
      port: 3306
      weight: 1000
  mysqlGaleraHostgroups:
    - writerHostgroup: 0
      backupWriterHostgroup: 2
      readerHostgroup: 1
      offlineHostgroup: 3
      # Single-writer routing: one node takes all writes, the other two wait
      # in the backup-writer hostgroup. Galera certifies writes cluster-wide,
      # so multi-writer is *correct* but conflicting transactions on different
      # nodes fail certification and get deadlock errors at COMMIT. Routing
      # writes to one node avoids that entirely. maxWriters: 3 restores the
      # multi-writer behavior this example used before — but it also empties
      # the backup-writer hostgroup, so switch writerIsAlsoReader to 1 at the
      # same time or query rule 100 will route SELECTs at an empty hostgroup.
      maxWriters: 1
      # 2 = only the backup writers also serve reads, so the writer stays
      # write-only. Use 1 to have the writer serve reads too, or 0 to mirror
      # neither tier — with no read-only node in a healthy PXC cluster that
      # leaves the reader hostgroup empty, so drop query rule 100 as well.
      writerIsAlsoReader: 2
      # A node whose wsrep_local_recv_queue exceeds this is parked in the
      # offline hostgroup until it catches up. ProxySQL's default is 0, which
      # tolerates no queued writesets.
      maxTransactionsBehind: 0
  mysqlUsers:
    - username: root
      defaultHostgroup: 0
      passwordSecretRef:
        name: cluster1-secrets
        key: root
  # ProxySQL's monitor pings each node and watches its wsrep state. PXC images
  # ship a `monitor` user whose password is the `monitor` key of
  # cluster1-secrets — these are admin variables (plain strings, no
  # secretRef), so the value must match that secret. Both ship with the same
  # REPLACE-ME placeholder; change them together.
  mysqlVariables:
    mysql-monitor_username: "monitor"
    mysql-monitor_password: "REPLACE-ME-monitor"
  mysqlQueryRules:
    - ruleId: 100
      active: true
      matchDigest: "^SELECT"
      destinationHostgroup: 1
      apply: true
      comment: "SELECTs → reader hostgroup (the backup writers)"
